<!-- ===== CarMall 火星塞快速查詢 — 貼進 Cyberbiz 自訂頁面的 HTML 區塊 ===== -->
<!-- max-width matches /pages/wiperguide so the two finder pages line up. -->
<div id="carmall-plug-finder" style="max-width:680px;margin:0 auto;">
  <iframe id="cmp-frame"
    src="https://liquimolytaiwan.github.io/carmall-ngk-finder/"
    style="width:100%;border:0;display:block;min-height:340px;"
    title="火星塞快速查詢" scrolling="no"></iframe>
</div>
<script>
(function () {
  var ORIGIN = "https://liquimolytaiwan.github.io";
  window.addEventListener("message", function (e) {
    var f = document.getElementById("cmp-frame");
    // Only the finder iframe may resize itself. Without these checks any other frame
    // or opened window on the page could post a height and distort the storefront.
    if (!f || e.origin !== ORIGIN || e.source !== f.contentWindow) return;
    if (!e.data || e.data.type !== "carmallPlugHeight") return;
    var h = Number(e.data.height);
    if (!(h > 0) || h > 5000) return;
    // Drop the pre-load placeholder so the frame can shrink back down as well as grow.
    f.style.minHeight = "0px";
    f.style.height = h + "px";
  });
})();
</script>
<!-- ===== 結束 ===== -->
