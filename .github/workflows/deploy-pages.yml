name: deploy-pages

# Publishes the repo root to GitHub Pages.
#
# GitHub's legacy Pages builder stopped dispatching for this repo on 2026-08-06 — builds
# sat at 0ms and then reported a bare "Page build failed" with no log, including on a
# commit containing nothing but a data.json timestamp bump. This is the build path GitHub
# now recommends, and unlike the legacy one it leaves a readable log when something breaks.
#
# The site is plain static files, so there is nothing to compile: upload the checkout and
# deploy it. A failed run leaves the previously deployed site serving untouched.

on:
  push:
    branches: [main]
  # refresh-data pushes with the default GITHUB_TOKEN, and GitHub never fires `push`
  # workflows for those pushes (anti-recursion rule). So from 2026-08-14 to 2026-10-12 the
  # live site sat on the last human push while the bot committed fresh data twice a day —
  # stale prices/stock, and after CarMall renamed 12 product handles on 2026-10-08 every
  # buy button went to a 404. `workflow_run` is not subject to that rule.
  workflow_run:
    workflows: [refresh-data]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_missing_artifact:
        # Test hook for the retry below. GitHub's glitch can't be triggered on purpose, so
        # this makes the first attempt ask for an artifact name that doesn't exist — the
        # same "No artifacts named ..." throw in deploy-pages — and the retry then deploys
        # the real one. Push, schedule and workflow_run runs have no inputs, so it's off.
        description: "Test only: fail the first deploy attempt to exercise the retry"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied deploy is worse
# than a slightly stale one. Queued duplicates collapse into the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A failed refresh keeps the old data.json on main, so there is nothing new to ship.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check data.json is present and parses
        # The whole finder is one fetch of data.json; shipping a truncated or invalid one
        # renders an empty picker with no error the customer can act on.
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data.json"))
          models = sum(len(b["models"]) for b in d["brands"])
          print(f"data.json: {len(d['brands'])} brands, {models} models, generated {d['generated']}")
          if models < 500:
              sys.exit(f"ERROR: only {models} models — data.json looks truncated")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        # GitHub sometimes reports `No artifacts named "github-pages"` for an artifact the
        # step above uploaded successfully (carmall-parts-finder twice on 2026-11-22, this
        # repo on 2026-11-23). A fresh run always deployed fine, and a re-run of the same
        # run later counted 2 artifacts, so the run's artifact list does catch up — just
        # not within the ~0.5s between upload and deploy. A failed attempt here moves on to
        # the retry below instead of ending the run red (and emailing a failure).
        continue-on-error: true
        with:
          artifact_name: ${{ inputs.simulate_missing_artifact && 'no-such-artifact-retry-test' || 'github-pages' }}
          # GitHub's Pages deployment queue backed up badly on 2026-08-06: the action's
          # default 10-minute wait expired twice while the deployment itself went on to
          # succeed server-side. That produces a red build for a deploy that actually
          # shipped — which is worse than a slow one, because the next person reads the
          # red and re-runs, or worse, stops trusting the signal.
          timeout: 1200000

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        # Nothing shows how long the artifact list takes to catch up, and this wait only
        # costs time on a run that would otherwise have failed, so it is generous. The
        # warning keeps a healed glitch visible on what is now a green run.
        run: |
          echo "::warning::First deploy attempt failed; retrying in 3 minutes (see the step above for the error)"
          sleep 180

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        # Deploy again from the artifact already uploaded — never re-upload: a second
        # upload in the same run makes deploy-pages fail with "Multiple artifacts named
        # github-pages". No continue-on-error here, so failing twice still ends red.
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
